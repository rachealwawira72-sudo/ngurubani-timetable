<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2848c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timetable">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">

<title>Ngurubani Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-first workbench. Bottom tab bar, one card per task, weekly grids that scroll sideways only inside their own frame.
   Junior = ultramarine, Primary = green; everything else is ink on cool paper. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface2: #eaeef4;
  --ink: #14213d;
  --muted: #5a6579;
  --line: #d9dfe8;
  --junior: #2848c8;
  --junior-soft: #dfe5fb;
  --primary: #0b7d62;
  --primary-soft: #d6efe7;
  --ok: #0f7b4f;
  --warn: #a8530a;
  --bad: #c0262d;
  --bad-soft: #fde4e4;
  --on-accent: #ffffff;
  --cs: 62%;
  --cl: 91%;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --surface: #151d2e; --surface2: #1d2740; --ink: #e8edf6; --muted: #98a4ba; --line: #2a3650;
    --junior: #8ea2ff; --junior-soft: #222f63; --primary: #46d0a6; --primary-soft: #15463b;
    --ok: #4cd08f; --warn: #f0a050; --bad: #ff7a80; --bad-soft: #4a1d24; --on-accent: #0d1320;
    --cs: 34%; --cl: 24%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --surface: #151d2e; --surface2: #1d2740; --ink: #e8edf6; --muted: #98a4ba; --line: #2a3650;
  --junior: #8ea2ff; --junior-soft: #222f63; --primary: #46d0a6; --primary-soft: #15463b;
  --ok: #4cd08f; --warn: #f0a050; --bad: #ff7a80; --bad-soft: #4a1d24; --on-accent: #0d1320;
  --cs: 34%; --cl: 24%; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
}
.app { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.08; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--junior); outline-offset: 2px; }
.eyebrow { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.j { background: var(--junior-soft); color: var(--junior); }
.chip.p { background: var(--primary-soft); color: var(--primary); }
.chip.b { background: var(--surface2); color: var(--ink); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--primary-soft); color: var(--ok); }
.chip.warn { background: var(--surface2); color: var(--warn); }

.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 6px 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.daybar { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.dbrow { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; }
.dbrow > span { font-size: 12px; font-weight: 600; }
.dbrow .j { color: var(--junior); } .dbrow .p { color: var(--primary); }
.track { position: relative; height: 22px; background: var(--surface2); border-radius: 6px; }
.blk { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; }
.blk.j { background: var(--junior); } .blk.p { background: var(--primary); }
.axis { position: relative; height: 14px; margin-left: 70px; }
.axis i { position: absolute; transform: translateX(-50%); font-style: normal; font-size: 10px; color: var(--muted); font-family: var(--font-mono); }

.row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; padding-top: 0; }
.li > div { min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 40px; }
.btn.primary { background: var(--junior); border-color: var(--junior); color: var(--on-accent); }
.btn.big { width: 100%; padding: 14px; font-size: 16px; min-height: 52px; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 13px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { width: 38px; height: 38px; border: 0; background: var(--surface2); font-size: 18px; font-weight: 600; }
.stepper output { min-width: 44px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.progress { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--junior); transition: width 0.12s linear; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.sheet .metrics { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet .metric { padding: 8px 10px; }
.metric { background: var(--surface2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.metric b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12px; color: var(--muted); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.inp { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }
select.inp { padding-right: 6px; }

.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

.pick { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: end; }
.pick .btn { padding: 0; min-height: 40px; }

/* weekly grid */
.ttwrap { overflow-x: auto; border-radius: 10px; }
.tt { display: grid; grid-template-columns: 52px repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tt > div, .tt > button { background: var(--surface); min-width: 0; }
.th { padding: 7px 4px; text-align: center; font-weight: 600; font-size: 13px; }
.th small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; font-family: var(--font-mono); }
.rh { padding: 4px 4px; display: flex; flex-direction: column; justify-content: center; gap: 0; font-family: var(--font-mono); font-size: 10px; line-height: 1.25; color: var(--muted); font-variant-numeric: tabular-nums; }
.rh b { font-family: var(--font-body); font-size: 12px; color: var(--ink); }
.rh i { font-style: normal; }
.rh i.j { color: var(--junior); } .rh i.p { color: var(--primary); }
.brk { grid-column: 1 / -1; background: var(--surface2) !important; font-size: 11px; color: var(--muted); padding: 3px 8px; text-align: center; letter-spacing: 0.04em; }
.cell { border: 0; border-radius: 0; padding: 5px 3px; min-height: 48px; display: flex; flex-direction: column; gap: 1px; text-align: left; line-height: 1.2; background: hsl(var(--h) var(--cs) var(--cl)) !important; position: relative; overflow: hidden; }
.cell b { font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; }
.cell span { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.free { background: var(--surface) !important; color: var(--muted); align-items: center; justify-content: center; }
.cell.empty { background: var(--surface) !important; }
.cell.bad { box-shadow: inset 0 0 0 2px var(--bad); }
.cell.bad::after { content: "!"; position: absolute; top: 2px; right: 4px; font-weight: 700; color: var(--bad); font-size: 12px; }
.cell.sel { box-shadow: inset 0 0 0 3px var(--junior); }
.cell.dbl { background: var(--bad-soft) !important; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs nav { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 2px; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-height: 44px; }
.tabs button[aria-current="page"] { background: var(--junior-soft); color: var(--junior); }

.tcard { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.tcard:first-child { border-top: 0; padding-top: 0; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.days { display: flex; gap: 5px; flex-wrap: wrap; }
.days button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; min-height: 34px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.bar { height: 6px; background: var(--surface2); border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--junior); }
.bar i.full { background: var(--ok); } .bar i.over { background: var(--bad); }

.lrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); align-items: end; }
.lrow:first-child { border-top: 0; padding-top: 0; }
.lrow .field.wide { grid-column: 1 / -1; }

.sched { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.sched table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sched td { padding: 6px 0; border-top: 1px solid var(--line); }
.sched td:last-child { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sched tr.b td { color: var(--muted); font-size: 12.5px; }

.banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--surface2); color: var(--warn); border: 1px solid var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.empty-state { text-align: center; padding: 28px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 22, 0.55); display: flex; align-items: flex-end; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet > div { background: var(--surface); border-radius: 16px 16px 0 0; padding: 16px; width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
.sheet textarea { width: 100%; height: 40vh; font-family: var(--font-mono); font-size: 12px; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.sheet > div { max-height: 90vh; overflow-y: auto; }
.sheet textarea.ed { background: var(--surface); }
.issues { display: flex; flex-direction: column; gap: 6px; }
.issue { display: flex; gap: 8px; font-size: 13.5px; align-items: flex-start; }
.issue .chip { flex: none; }
.issue span:last-child { min-width: 0; overflow-wrap: anywhere; }
label.btn { display: inline-flex; align-items: center; }

.seg.days button { padding: 7px 10px; }
.mtwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mt { border-collapse: separate; border-spacing: 0; font-size: 12px; width: max-content; min-width: 100%; }
.mt th, .mt td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; background: var(--surface); font-weight: 500; }
.mt thead th { background: var(--surface2); font-weight: 600; padding: 5px 2px; }
.mt th.cl { position: sticky; left: 0; z-index: 2; text-align: left; background: var(--surface); box-shadow: 1px 0 0 var(--line); min-width: 62px; }
.mt thead th.cl { background: var(--surface2); z-index: 3; padding-left: 8px; }
.mt tr.sec th { position: sticky; left: 0; text-align: left; background: var(--surface2); padding: 6px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.mt tr.sec.j th { color: var(--junior); } .mt tr.sec.p th { color: var(--primary); }
.mt tr.tmr th { font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-weight: 500; height: 20px; font-variant-numeric: tabular-nums; }
.mt tr.tmr th.cl { padding-left: 8px; font-family: var(--font-body); }
.mt td.c { min-width: 46px; height: 40px; padding: 2px; line-height: 1.15; background: hsl(var(--h) var(--cs) var(--cl)); }
.mt td.c b { display: block; font-size: 11.5px; }
.mt td.c span { display: block; font-size: 10.5px; color: var(--muted); }
.mt td.free { background: var(--surface); color: var(--muted); }
.mt td.na { background: var(--surface2); }
.mt td.bad { box-shadow: inset 0 0 0 2px var(--bad); }
.mt td.dim { opacity: 0.2; }
.mt td.hit { box-shadow: inset 0 0 0 2px var(--ink); }
.mt .bk { border-right: 2px solid var(--muted); }
.mt .lk { border-right: 3px solid var(--ink); }
.mt .cn { border: 0; background: none; font: inherit; font-weight: 700; padding: 6px 8px; width: 100%; text-align: left; min-height: 40px; color: var(--ink); }
.mt thead th.dh { font-family: var(--font-display); font-size: 13px; border-right: 3px solid var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
@media (min-width: 640px) { h1 { font-size: 38px; } .card { padding: 18px; } .tt { grid-template-columns: 92px repeat(5, minmax(90px, 1fr)); } .cell b { font-size: 14px; } .cell span { font-size: 12px; } .rh { font-size: 11px; } }
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs" aria-label="Sections"></nav></div>
<div id="overlay"></div>

<script>
/* ===== Ngurubani timetable engine (no DOM) ===== */
var TT = (function () {
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  var D = 5;

  // Daily schedules in minutes from midnight.
  var SCHEDULE = {
    J: [
      { t: 'L', s: 500, e: 540 }, { t: 'L', s: 540, e: 580 }, { t: 'B', s: 580, e: 595, label: 'Break' },
      { t: 'L', s: 595, e: 635 }, { t: 'L', s: 635, e: 675 }, { t: 'B', s: 675, e: 690, label: 'Break' },
      { t: 'L', s: 690, e: 730 }, { t: 'L', s: 730, e: 770 }, { t: 'B', s: 770, e: 840, label: 'Lunch' },
      { t: 'L', s: 840, e: 880 }, { t: 'L', s: 880, e: 920 }
    ],
    P: [
      { t: 'L', s: 500, e: 535 }, { t: 'L', s: 535, e: 570 }, { t: 'B', s: 570, e: 595, label: 'Break' },
      { t: 'L', s: 595, e: 630 }, { t: 'L', s: 630, e: 665 }, { t: 'B', s: 665, e: 690, label: 'Break' },
      { t: 'L', s: 690, e: 725 }, { t: 'L', s: 725, e: 760 }, { t: 'B', s: 760, e: 840, label: 'Lunch' },
      { t: 'L', s: 840, e: 875 }
    ]
  };
  function bellsOf(sec) { return SCHEDULE[sec].filter(function (x) { return x.t === 'L'; }); }
  var BELLS = { J: bellsOf('J'), P: bellsOf('P') };

  function fmt(m, suffix) {
    var h = Math.floor(m / 60), mm = m % 60;
    var h12 = h % 12 || 12;
    return h12 + ':' + (mm < 10 ? '0' : '') + mm + (suffix ? (h >= 12 ? ' pm' : ' am') : '');
  }

  var CORE = ['English', 'Kiswahili', 'Mathematics', 'Integrated Science', 'Science & Technology'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- time clash rules ---------- */
  function buildConflicts(buffer) {
    var nJ = BELLS.J.length, nP = BELLS.P.length, NK = nJ + nP;
    var times = BELLS.J.concat(BELLS.P);
    var others = [];
    for (var k = 0; k < NK; k++) {
      others.push([]);
      for (var k2 = 0; k2 < NK; k2++) {
        if (k === k2) continue;
        var sameSec = (k < nJ) === (k2 < nJ);
        if (sameSec) continue; // different periods of one section never overlap
        var a = times[k], b = times[k2];
        if (a.s < b.e + buffer && b.s < a.e + buffer) others[k].push(k2);
      }
    }
    return { nJ: nJ, nP: nP, NK: NK, others: others };
  }

  /* ---------- solver ---------- */
  function Solver(data, seed) {
    var self = this;
    this.data = data;
    this.rng = mulberry32(seed || 12345);
    var buffer = data.buffer == null ? 5 : data.buffer;
    var cf = buildConflicts(buffer);
    var NK = cf.NK, nJ = cf.nJ;
    this.cf = cf;
    this.maxDay = data.maxPerDay || 7;
    this.W = 20;

    var tIndex = {};
    data.teachers.forEach(function (t, i) { tIndex[t.id] = i; });
    var T = data.teachers.length;
    this.T = T;
    this.off = new Uint8Array(T * D);
    data.teachers.forEach(function (t, i) {
      (t.off || []).forEach(function (d) { if (d >= 0 && d < D) self.off[i * D + d] = 1; });
    });

    var subjIdx = { '': 0 }, subjNames = [''];
    function sid(n) { if (subjIdx[n] == null) { subjIdx[n] = subjNames.length; subjNames.push(n); } return subjIdx[n]; }
    this.subjNames = subjNames;

    this.lsub = []; this.lteach = [];
    this.classes = data.classes;
    this.C = data.classes.length;
    this.np = []; this.secOff = []; this.grid = []; this.unplaced = [];
    var byClass = {};
    data.assignments.forEach(function (a) { (byClass[a.cls] = byClass[a.cls] || []).push(a); });

    for (var c = 0; c < this.C; c++) {
      var cl = data.classes[c];
      var np = BELLS[cl.section].length;
      this.np.push(np);
      this.secOff.push(cl.section === 'J' ? 0 : nJ);
      var slots = D * np;
      var ids = [];
      (byClass[cl.id] || []).forEach(function (a) {
        var ti = a.teacher != null && tIndex[a.teacher] != null ? tIndex[a.teacher] : -1;
        var s = sid(a.subject);

    h += '<section class="card"><details><summary>Backup and restore</summary><div style="display:flex;flex-direction:column;gap:10px;padding-top:6px">' +
      '<p class="muted small">Your work is kept in this browser. Save a backup file to move it to another phone or computer.</p>' +

      '<button class="btn" data-action="backupcopy">Copy backup text</button>' +
      '<label class="btn" for="restore-file" style="display:inline-flex;align-items:center">Restore backup</label><input id="restore-file" type="file" accept=".json,application/json" hidden>' +
      '<button class="btn danger" data-action="reset">Reset to sample data</button></div></div></details></section>';

  }

  function quality() {
    var dup = 0, late = 0;
    if (!S.cells) return { dupDays: 0, coreLate: 0 };
    var cb = cById();
    Object.keys(S.cells).forEach(function (cid) {
      var np = S.cells[cid][0] ? S.cells[cid][0].length : 0;
      S.cells[cid].forEach(function (row) {
        var m = {};
        row.forEach(function (cell, p) {
          if (!cell.s) return;
          m[cell.s] = (m[cell.s] || 0) + 1;
          if (TT.CORE.indexOf(cell.s) >= 0 && p >= np - 2) late++;
        });
        for (var k in m) if (m[k] > 1) dup++;
      });
    });
    return { dupDays: dup, coreLate: late };
  }

  /* ---- timetable view ---- */
  function cellHtml(cell, opts) {
    // opts: cls, d, p, bad, sel, label
    var attr = ' data-action="cell" data-cls="' + esc(opts.cls) + '" data-d="' + opts.d + '" data-p="' + opts.p + '"';
    if (!cell || !cell.s) return '<button class="cell free' + (opts.sel ? ' sel' : '') + '"' + attr + ' aria-label="Free period">free</button>';
    var cls = 'cell' + (opts.bad ? ' bad' : '') + (opts.sel ? ' sel' : '');
    return '<button class="' + cls + '" style="--h:' + hue(cell.s) + '"' + attr + '><b>' + esc(opts.top) + '</b><span>' + esc(opts.bottom) + '</span></button>';
  }

  function classGrid(cid, V) {
    var c = cById()[cid], tm = tById(), sec = c.section, bells = TT.BELLS[sec], rows = S.cells[cid];
    var h = '<div class="ttwrap"><div class="tt"><div class="th"></div>' + TT.DAYS.map(function (d, i) { return '<div class="th">' + d + '</div>'; }).join('');
    var li = 0;
    TT.SCHEDULE[sec].forEach(function (item) {
      if (item.t === 'B') { h += '<div class="brk">' + item.label + ' &middot; ' + time(item.s) + '&ndash;' + time(item.e) + '</div>'; return; }
      var p = li++;
      h += '<div class="rh"><b>' + (p + 1) + '</b><i class="' + (sec === 'J' ? 'j' : 'p') + '">' + time(item.s) + '</i><i>' + time(item.e) + '</i></div>';
      for (var d = 0; d < 5; d++) {
        var cell = rows[d][p];
        var key = cid + '|' + d + '|' + p;
        h += cellHtml(cell, { cls: cid, d: d, p: p, bad: V.bad[key], sel: S.pick && S.pick.cls === cid && S.pick.d === d && S.pick.p === p, top: abbr(cell.s), bottom: shortName(tm[cell.t]) });
      }
    });
    return h + '</div></div>';
  }

  function teacherGrid(tid, V) {
    var tm = tById(), cb = cById(), lv = TT.teacherLevels(S.data)[tid] || { J: 0, P: 0 };
    var lvl = levelOf(lv);
    var showJ = lvl !== 'P', showP = lvl !== 'J';
    // map d|row -> list of {cls, s}
    var map = {}, perDay = [0, 0, 0, 0, 0], total = 0;
    Object.keys(S.cells).forEach(function (cid) {
      S.cells[cid].forEach(function (row, d) {
        row.forEach(function (cell, p) {
          if (cell.t === tid) { var k = d + '|' + p; (map[k] = map[k] || []).push({ cls: cid, s: cell.s, p: p }); perDay[d]++; total++; }
        });
      });
    });
    var nRows = showJ ? 8 : 7;
    var h = '<div class="ttwrap"><div class="tt"><div class="th"></div>' + TT.DAYS.map(function (d, i) { return '<div class="th">' + d + '<small>' + perDay[i] + '</small></div>'; }).join('');
    var jb = TT.BELLS.J, pb = TT.BELLS.P;
    for (var n = 0; n < nRows; n++) {
      if (n === 2 || n === 4 || n === 6) {
        var lab = n === 6 ? 'Lunch' : 'Break';
        var jt = TT.SCHEDULE.J.filter(function (x) { return x.t === 'B'; })[n / 2 - 1];
        var pt = TT.SCHEDULE.P.filter(function (x) { return x.t === 'B'; })[n / 2 - 1];
        var parts = [];
        if (showJ) parts.push('J ' + time(jt.s) + '&ndash;' + time(jt.e));
        if (showP) parts.push('P ' + time(pt.s) + '&ndash;' + time(pt.e));
        h += '<div class="brk">' + lab + ' &middot; ' + parts.join(' &middot; ') + '</div>';
      }
      var rh = '<div class="rh"><b>' + (n + 1) + '</b>';
      var both = showJ && showP;
      if (showJ && jb[n]) rh += '<i class="j">' + time(jb[n].s) + (both ? '' : '</i><i>' + time(jb[n].e)) + '</i>';
      if (showP && pb[n]) rh += '<i class="p">' + time(pb[n].s) + (both ? '' : '</i><i>' + time(pb[n].e)) + '</i>';
      h += rh + '</div>';
      for (var d = 0; d < 5; d++) {
        var list = map[d + '|' + n] || [];
        if (!list.length) { h += '<div class="cell empty"></div>'; continue; }
        var it = list[0], cellObj = { s: it.s };
        var bad = list.some(function (x) { return V.bad[x.cls + '|' + d + '|' + x.p]; });
        var top = shortClass(cb[it.cls]) + (list.length > 1 ? ' +' + (list.length - 1) : '');
        h += cellHtml(cellObj, { cls: it.cls, d: d, p: it.p, bad: bad, top: top, bottom: abbr(it.s) });
      }
    }
    return { html: h + '</div></div>', total: total, perDay: perDay, lvl: lvl };
  }

          return '<option value="' + esc(c.id) + '"' + (c.id === S.selClass ? ' selected' : '') + '>' + esc(c.name) + '</option>';

      var c = cb[S.selClass], tot = TT.slotsFor(c.section);
      h += '<div class="row small muted"><span>' + (c.section === 'J' ? '<span class="chip j">Junior &middot; 40 min</span>' : '<span class="chip p">Primary &middot; 35 min</span>') + '</span><span>' + tot + ' periods a week</span></div>';
      if (S.edit) h += '<p class="small muted">Tap a lesson, then tap another lesson in this class to swap them. Clashes show a red outline.' + (S.undo ? ' <button class="btn sm" data-action="undo">Undo last swap</button>' : '') + '</p>';
      h += classGrid(S.selClass, V);
      // teacher key
      var used = {}; S.cells[S.selClass].forEach(function (r) { r.forEach(function (x) { if (x.t) used[x.s + '|' + x.t] = 1; }); });
      h += '<details><summary>Who teaches what</summary><div class="list">' + Object.keys(used).map(function (k) { var a = k.split('|'); return '<div class="li"><span>' + esc(a[0]) + '</span><span class="muted">' + esc(tm[a[1]] ? tm[a[1]].name : '') + '</span></div>'; }).join('') + '</div></details>';
    } else {
      var groups = { J: [], P: [], B: [], '-': [] };
      tsorted.forEach(function (t) { var l = lvAll[t.id]; groups[levelOf(l)].push(t); });
      var gl = { J: 'Junior only', P: 'Primary only', B: 'Both levels', '-': 'No lessons' };
      var opts2 = ['B', 'J', 'P', '-'].filter(function (k) { return groups[k].length; }).map(function (k) {
        return '<optgroup label="' + gl[k] + '">' + groups[k].map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === S.selTeacher ? ' selected' : '') + '>' + esc(t.name) + ' &middot; ' + esc(t.area || '') + '</option>'; }).join('') + '</optgroup>';
      }).join('');
      h += '<div class="pick"><button class="btn" data-action="step" data-v="-1" aria-label="Previous teacher">&lsaquo;</button><div class="field"><label for="sel-teacher">Teacher</label><select class="inp" id="sel-teacher">' + opts2 + '</select></div><button class="btn" data-action="step" data-v="1" aria-label="Next teacher">&rsaquo;</button></div>';
      var g = S.selTeacher ? teacherGrid(S.selTeacher, V) : null;
      if (g) {

        h += g.html;
      }
    }
    h += '</section>';

    h += '<section class="card"><header><h2>Share or print</h2></header><p class="muted small">Copy a timetable and paste it into Word, Excel or WhatsApp, or save it as a file that opens in Excel.</p><div class="btnrow">' +
      '<button class="btn" data-action="copyview">Copy this one</button>' +
      (DL ? '<button class="btn" data-action="saveview">Save this one</button>' + (S.vmode === 'school' ? '<button class="btn" data-action="saveprint">Save for printing</button>' : '') + '<button class="btn" data-action="saveclasses">Save all classes</button><button class="btn" data-action="saveteachers">Save all teachers</button>' : '') +
      '</div></section>';
    return h;
  }

        '<span class="stepper" aria-label="Weekly limit"><button data-action="tmax" data-id="' + t.id + '" data-v="-1" aria-label="Lower weekly limit">&minus;</button><output>' + mx + '</output><button data-action="tmax" data-id="' + t.id + '" data-v="1" aria-label="Raise weekly limit">+</button></span></div>' +

  /* ---- bells view ---- */
  function bellsView() {

  }

  /* ---------- render ---------- */
  var VIEWS = [['gen', 'Generate'], ['view', 'Timetable'], ['teachers', 'Teachers'], ['lessons', 'Lessons'], ['bells', 'Bells']];
  var FULLDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      S.gen = { running: false, p: 1, result: { clashes: V.clashes.length + V.offHits.length, names: Object.keys(names).slice(0, 5).join(', '), ms: performance.now() - t0 } };
      save(); render();
    }
    setTimeout(tick, 20);
  }

  /* ---------- events ---------- */
  function stepSelect(list, cur, v) {
    var i = list.indexOf(cur); i = (i + v + list.length) % list.length; return list[i];
  }
  function teacherOrder() {

      case 'imp-paste': S.sheet = { kind: 'paste' }; renderOverlay(); break;
      case 'imp-read': { var ta = $('#paste-text'); S.pasteText = ta ? ta.value : S.pasteText; startImport(S.pasteText); break; }

      case 'imp-cancel': S.imp = null; renderOverlay(); break;
      case 'imp-apply': {
        if (!S.imp || !S.imp.parsed.assignments.length) return;

        S.gen = { running: false, p: 0, result: null }; S.selClass = S.data.classes[0].id; S.lClass = S.data.classes[0].id; S.selTeacher = null;
        S.imp = null; S.pasteText = ''; save(); render(); toast('Imported. Now generate the timetable.');

      }
      case 'nav': S.view = v; S.pick = null; render(); window.scrollTo(0, 0); break;
      case 'gen': startGen(); break;

      case 'maxday': d.maxPerDay = Math.max(4, Math.min(8, (d.maxPerDay || 7) + Number(v))); touch(true); $('#md-out').textContent = d.maxPerDay; break;
      case 'vmode': S.vmode = v; S.pick = null; S.edit = false; render(); break;
      case 'edit': S.edit = !S.edit; S.pick = null; render(); break;
      case 'step':
        if (S.vmode === 'class') S.selClass = stepSelect(d.classes.map(function (c) { return c.id; }), S.selClass, Number(v));
        else S.selTeacher = stepSelect(teacherOrder(), S.selTeacher, Number(v));
        S.pick = null; render(); break;
      case 'lstep': S.lClass = stepSelect(d.classes.map(function (c) { return c.id; }), S.lClass, Number(v)); render(); break;
      case 'cell': {
        if (S.vmode !== 'class' || !S.edit) return;
        var cid = el.getAttribute('data-cls'), dd = Number(el.getAttribute('data-d')), pp = Number(el.getAttribute('data-p'));
        if (!S.pick) { S.pick = { cls: cid, d: dd, p: pp }; render(); return; }
        if (S.pick.d === dd && S.pick.p === pp) { S.pick = null; render(); return; }
        var rows = S.cells[cid], A = S.pick, tmp = rows[A.d][A.p];
        rows[A.d][A.p] = rows[dd][pp]; rows[dd][pp] = tmp;
        S.undo = { cls: cid, a: [A.d, A.p], b: [dd, pp] };

        break;
      }
      case 'undo': {
        if (!S.undo) return; var u = S.undo, r = S.cells[u.cls], t2 = r[u.a[0]][u.a[1]];
        r[u.a[0]][u.a[1]] = r[u.b[0]][u.b[1]]; r[u.b[0]][u.b[1]] = t2; S.undo = null; save(); render(); toast('Swap undone'); break;
      }
      case 'copyview': copyText(tsv(currentRows()), 'Copy this timetable'); break;
      case 'saveview':
        if (S.vmode === 'school') saveFile('ngurubani-master-timetable.csv', csv(masterRows('week')));
        else saveFile('ngurubani-' + fname(currentRows()[0][0]) + '.csv', csv(currentRows()));
        break;
      case 'saveprint': saveFile('ngurubani-master-timetable-print.html', masterPrintHtml()); break;
      case 'mday': S.mDay = v; render(); break;
      case 'gotoclass': S.vmode = 'class'; S.selClass = el.getAttribute('data-cls'); S.pick = null; S.edit = false; render(); window.scrollTo(0, 0); break;
      case 'saveclasses': saveFile('ngurubani-all-classes.csv', csv(allClassRows())); break;
      case 'saveteachers': saveFile('ngurubani-all-teachers.csv', csv(allTeacherRows())); break;
      case 'backup': saveFile('ngurubani-timetable-backup.json', JSON.stringify({ data: d, cells: S.cells, stale: S.stale, sample: S.sample })); break;
      case 'backupcopy': copyText(JSON.stringify({ data: d, cells: S.cells, stale: S.stale, sample: S.sample }), 'Backup text'); break;
      case 'reset':
        if (el.getAttribute('data-sure')) { S.data = TT.sampleData(); S.cells = null; S.sample = true; S.stale = false; S.gen = { running: false, p: 0, result: null }; save(); render(); toast('Sample data restored'); }

        break;
      case 'tadd': { var nt = { id: uid(), name: 'New teacher', area: '', max: 30, off: [] }; d.teachers.unshift(nt); S.fLevel = 'all'; S.fQ = ''; touch(true); render(); var inp = $('#tn-' + nt.id); if (inp) { inp.focus(); inp.select(); } break; }
      case 'tdel': d.teachers = d.teachers.filter(function (t) { return t.id !== id; }); touch(true); render(); break;
      case 'tmax': { var t = tById()[id]; t.max = Math.max(5, Math.min(40, (t.max || 30) + Number(v))); touch(false); render(); break; }
      case 'toff': { var t3 = tById()[id], k = Number(el.getAttribute('data-d')); t3.off = t3.off || []; var ix = t3.off.indexOf(k); if (ix >= 0) t3.off.splice(ix, 1); else t3.off.push(k); touch(true); render(); break; }

  });

      var fr0 = new FileReader();

      fr0.onerror = function () { toast('Could not read that file'); };
      fr0.readAsText(f0); el.value = ''; return;
    }
    if (el.id === 'restore-file') {
      var f = el.files && el.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          if (!o.data || !o.data.classes || !o.data.teachers || !o.data.assignments) throw new Error('bad');
          S.data = o.data; S.cells = o.cells || null; S.stale = !!o.stale; S.sample = !!o.sample; S.gen = { running: false, p: 0, result: null };

    }
  });

    var el = ev.target, b = el.getAttribute && el.getAttribute('data-bind'), d = S.data;

    var id = el.getAttribute('data-id');

  load();

})();
